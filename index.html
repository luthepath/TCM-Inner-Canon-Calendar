<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>内经时间 | Inner Canon Calendar</title>
<meta name="description" content="按《黄帝内经·素问》看此刻：时辰、四时、月相、二十四节气、干支月与四季，配原文、白话和养生提示。">
<meta name="theme-color" content="#F3F2EE">
<meta property="og:type" content="website">
<meta property="og:title" content="内经时间 | Inner Canon Calendar">
<meta property="og:description" content="按《黄帝内经·素问》看此刻：时辰、月相、节气、四季，配原文与养生提示。">
<meta property="og:image" content="https://luthepath.github.io/TCM-Inner-Canon-Calendar/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F3F2EE'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23A9A79F' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%232B2B2B' stroke-width='6'/%3E%3Ccircle cx='32' cy='8' r='6' fill='%23FFC61A' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* 没有宋体的设备（多数安卓、Windows）用这套随页附带的思源宋体子集；苹果设备直接用系统宋体，不会下载 */
@font-face{font-family:"NJ Serif"; src:url("fonts/serif-regular.woff2") format("woff2"); font-weight:100 500; font-display:swap}
@font-face{font-family:"NJ Serif"; src:url("fonts/serif-bold.woff2") format("woff2"); font-weight:600 900; font-display:swap}
:root{
  --serif:"Songti SC","STSong","NJ Serif","Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC",serif;
  --paper:#F3F2EE; --ink:#1D1E1C; --muted:#6B6C66; --faint:#A2A29B; --label:#74756F;
  --band:#E3E1DB; --line:#D3D1CA; --card:#FBFAF7; --rule:rgba(29,30,28,.16);
  --gold:#FFC61A; --red:#AE3424; --off:#2B6A45; --work:#8A6B3D;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; touch-action:manipulation}   /* 防止手机上连点时被放大 */
html,body{overflow-x:hidden}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:16px; line-height:1.7}
button,select{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
:focus-visible{outline:2px solid var(--ink); outline-offset:3px; border-radius:3px}
.page{max-width:1480px; margin:0 auto; padding:clamp(16px,2.6vw,44px); padding-bottom:max(clamp(16px,2.6vw,44px),env(safe-area-inset-bottom))}
.link{border-bottom:1px solid currentColor; color:var(--ink)}
.link:hover{color:var(--red)}
.nav{width:32px; height:32px; border-radius:50%; font-size:20px; line-height:1; display:grid; place-items:center; flex:none}
.nav:hover{background:var(--band)}
.h{margin:0; font-size:20px; font-weight:900; letter-spacing:.14em}

/* ---------- 页首 ---------- */
.hbar{grid-area:bar; position:relative; z-index:1; display:grid; grid-template-columns:1fr auto auto; grid-template-areas:"title info time"; align-items:center; column-gap:clamp(12px,1.6vw,22px);
  padding:4px 6px 14px; margin-bottom:12px; border-bottom:1px solid var(--rule)}
.title{grid-area:title; margin:0; font-size:clamp(26px,2.4vw,34px); font-weight:900; letter-spacing:.1em; line-height:1.1}
.hbar .clock-info{grid-area:info}
.hbar .clock-time{grid-area:time}
.clock{display:flex; align-items:flex-end; gap:14px}
.clock-info{margin:0; font-size:15px; line-height:1.55; text-align:right; letter-spacing:.04em; align-self:center}
.clock-info b{font-weight:700}
.clock-time{font-size:clamp(40px,4vw,58px); font-weight:700; line-height:.9; font-variant-numeric:tabular-nums}

/* ---------- 版框 ---------- */
.hero{position:relative; overflow:hidden; display:grid; grid-template-columns:clamp(150px,13vw,210px) minmax(0,1fr) clamp(260px,23vw,340px);
  grid-template-areas:"bar bar bar" "term dial quote"; border:2px solid rgba(29,30,28,.72); padding:clamp(14px,1.6vw,24px)}
.hero::before{content:""; position:absolute; inset:5px; border:1px solid rgba(29,30,28,.38); pointer-events:none}

/* 日期栏 + 日期带 */
.datebar{grid-area:bar; position:relative; z-index:1; padding:0 4px 10px; margin-bottom:12px; border-bottom:1px solid var(--rule); min-width:0}
.strip-wrap{display:flex; align-items:center; gap:4px}
.strip{flex:1; display:flex; gap:4px; overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none; padding:2px}
.strip::-webkit-scrollbar{display:none}
.sd{position:relative; flex:none; width:58px; padding:5px 2px 6px; border-radius:6px; display:flex; flex-direction:column; align-items:center; gap:1px; background:var(--card)}
.sd:hover{background:var(--band)}
.sd .w{font-size:11px; color:var(--muted); line-height:1.2}
.sd .n{font-size:18px; line-height:1.2; font-variant-numeric:tabular-nums}
.sd .sub{font-size:10.5px; color:var(--muted); line-height:1.3; white-space:nowrap}
.sd .sub.term{color:var(--red); font-weight:700}
.sd svg{width:13px; height:13px; margin-top:2px}
.sd .tag{position:absolute; top:3px; right:4px; font-size:9.5px; font-style:normal; line-height:1.3}
.tag.off{color:var(--off)} .tag.work{color:var(--work)}
.sd.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sd.sel{background:var(--ink); color:var(--paper)}
.sd.sel .w,.sd.sel .sub,.sd.sel .tag{color:var(--paper)}

/* 左：节气竖排 */
.term-col{grid-area:term; border-right:1px solid var(--rule); padding:8px clamp(10px,1.2vw,20px) 8px 4px; display:flex; justify-content:flex-end}
.vert{writing-mode:vertical-rl; -webkit-writing-mode:vertical-rl}
.term-v{display:flex; gap:clamp(8px,1vw,16px); height:min(560px,64vh)}
.term-name{margin:0; font-size:clamp(76px,7.6vw,118px); font-weight:900; line-height:1.04; letter-spacing:.04em}
.term-meta{margin:0; font-size:15px; letter-spacing:.24em; color:var(--muted); line-height:1.7}
.term-meta b{color:var(--red); font-weight:700}

/* 右：原文竖排 + 白话 + 养生 */
.quote-col{grid-area:quote; border-left:1px solid var(--rule); padding:8px 4px 8px clamp(14px,1.4vw,24px); display:flex; flex-direction:column; min-width:0}
.q-head{display:flex; align-items:baseline; gap:10px; font-size:14px; color:var(--muted); letter-spacing:.1em; margin-bottom:12px; flex-wrap:wrap}
.q-head b{color:var(--ink); font-size:16px; letter-spacing:.12em}
.q-head .hint{font-size:12px; letter-spacing:.04em; color:var(--faint)}
.q-v{height:min(320px,38vh); align-self:flex-end; max-width:100%; overflow-x:auto; overflow-y:hidden}
.q-v p{margin:0; font-size:clamp(21px,1.7vw,25px); font-weight:700; line-height:1.85; letter-spacing:.14em}
.q-v cite{display:block; font-style:normal; font-size:13px; color:var(--muted); letter-spacing:.14em; text-align:end; margin-block-start:10px}
.q-plain{margin:14px 0 0; font-size:14.5px; line-height:1.9; border-top:1px solid var(--rule); padding-top:12px}
.q-more{margin:8px 0 0; font-size:13.5px; line-height:1.85; color:var(--ink)}
.q-more cite{font-style:normal; color:var(--muted); font-size:12.5px; margin-left:.4em}
.q-full{margin:8px 0 0; font-size:13px; line-height:1.9; color:var(--faint)}
.q-full mark{background:none; color:var(--ink); box-shadow:inset 0 -.35em 0 rgba(255,198,26,.45)}
.q-tip{margin:14px 0 0; padding:10px 12px; background:var(--card); border-radius:6px; font-size:14px; line-height:1.85}
.q-tip b{display:block; font-size:13px; letter-spacing:.2em; margin-bottom:2px}
.q-tip small{display:block; color:var(--faint); font-size:11.5px; margin-top:4px; letter-spacing:.02em}
.q-note{margin:8px 0 0; font-size:12.5px; line-height:1.8; color:var(--muted)}
.q-more:empty,.q-full:empty,.q-note:empty{display:none}

/* ---------- 圆环 ---------- */
.dial-col{grid-area:dial; min-width:0; display:flex; flex-direction:column; align-items:center; padding:8px clamp(8px,1.4vw,24px) 0}
.dial-top{align-self:stretch; display:flex; justify-content:flex-end; min-height:28px; margin-bottom:4px}
.today-btn{font-size:16px; letter-spacing:.14em; padding:0 2px 3px; color:var(--ink); border-bottom:2px solid rgba(29,30,28,.72)}   /* 可点：和外框一样的深色、粗细 */
.today-btn:hover{color:var(--red); border-color:var(--red)}
.today-btn.is-today{color:var(--muted); padding-bottom:4px; border-bottom:1px solid var(--rule)}                                    /* 已是今日：和分割线一样 */
.orrery{position:relative; width:100%; max-width:720px; touch-action:pan-y; -webkit-user-select:none; user-select:none; --u:.9}
.orrery::before{content:""; display:block; padding-top:100%}                 /* 正方形，不依赖 aspect-ratio */
.plane{position:absolute; inset:0; transform-style:flat; perspective:1700px}   /* 不用 preserve-3d，避免圆环交叉处闪烁 */
.layer{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; transition:opacity .3s}
.seg{pointer-events:visibleStroke; cursor:pointer; transition:opacity .25s}
.orrery.moving .seg{cursor:grab}
.orrery.dragging .seg{cursor:grabbing}
.gap{stroke:var(--paper); stroke-width:2.2; pointer-events:none}
.tk{stroke:var(--ink); stroke-opacity:.28; stroke-width:1; pointer-events:none}
/* 选中某一格：其余全部半透明 */
.orrery.has-sel .seg:not(.on){opacity:.22}
.orrery.has-sel .lab:not(.on){opacity:calc(var(--d,1)*.22)}
.orrery.has-sel .links{opacity:.2}
/* 看别的日子：时辰和四时没有意义，变浅 */
.orrery.notime .L-sc,.orrery.notime .L-q{opacity:.35}
.orrery.notime .mkr.r-sc,.orrery.notime .mkr.r-q{display:none}
.orrery.notime .lab.r-sc,.orrery.notime .lab.r-q{opacity:calc(var(--d,1)*.35)}
.orrery.has-sel.notime .lab.r-sc.on,.orrery.has-sel.notime .lab.r-q.on{opacity:var(--d,1)}

/* 浮在圈上、始终正着的字 */
.labels{position:absolute; inset:0; pointer-events:none; z-index:2}
/* 连接各圈黄点的金色光线 */
.links{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:2500; transition:opacity .25s}
.links .lg{fill:none; stroke:#FFC61A; stroke-width:3.4; stroke-opacity:.55; stroke-linejoin:round; stroke-linecap:round}
.links .lc{fill:none; stroke:#FFE27A; stroke-width:.9; stroke-linejoin:round; stroke-linecap:round}
.lab{position:absolute; left:0; top:0; white-space:nowrap; color:var(--label); line-height:1; opacity:var(--d,1); transition:opacity .25s; font-size:calc(var(--u)*14px)}
.lab.r-sc{font-size:calc(var(--u)*15px)}
.lab.r-q{font-size:calc(var(--u)*14px)}
.lab.r-t{font-size:calc(var(--u)*14.5px)}
.lab.r-mo{font-size:calc(var(--u)*15px)}
.lab.r-s{font-size:calc(var(--u)*27px)}
.lab.badge{font-size:calc(var(--u)*10.5px); width:calc(var(--u)*19px); height:calc(var(--u)*19px); border-radius:50%; background:#EEEDE9; display:grid; place-items:center; color:var(--muted); font-variant-numeric:tabular-nums}
.lab.halo{text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 2px var(--paper)}
.lab.moon{width:calc(var(--u)*22px); height:calc(var(--u)*22px)}
/* 黄色定位点：和字一样始终正着 */
.lab.mkr{z-index:3000 !important}
.mkr .dot{display:block; width:calc(var(--u)*13px); height:calc(var(--u)*13px); border-radius:50%; background:var(--gold); border:calc(var(--u)*2px) solid #fff; box-shadow:0 0 calc(var(--u)*10px) calc(var(--u)*3px) rgba(255,198,26,.65)}
.mkr svg{display:block; width:calc(var(--u)*26px); height:calc(var(--u)*26px); overflow:visible; filter:drop-shadow(0 0 4px rgba(255,198,26,.8))}
.lab.moon svg{display:block; width:100%; height:100%; overflow:visible}
.lab.moon.today svg{filter:drop-shadow(0 0 5px rgba(255,198,26,.95))}

/* 中心的人 */
.person{position:absolute; left:50%; top:50%; width:13%; height:13%; transform:translate(-50%,-50%); pointer-events:none; z-index:1000}   /* 远处的字在它后面，近处的字在它前面 */
.person svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 6px rgba(255,200,20,.85)) drop-shadow(0 0 1px rgba(255,180,0,.9)); transition:opacity .6s}
.person .stand{opacity:1} .person .walk{opacity:0}
.orrery.moving .person .stand{opacity:0} .orrery.moving .person .walk{opacity:1}
.walk .lm{stroke:#FFFDF6; stroke-linecap:round; fill:none}
.walk .back{stroke:#F3EBD5}
.walk .leg{transform-origin:50px 56px} .walk .shin{transform-origin:50px 74px} .walk .arm{transform-origin:50px 30px}
.orrery.moving .walk .bob{animation:w-bob 1.1s linear infinite}
.orrery.moving .walk .leg{animation:w-thigh 1.1s ease-in-out infinite}
.orrery.moving .walk .shin{animation:w-shin 1.1s ease-in-out infinite}
.orrery.moving .walk .arm{animation:w-arm 1.1s ease-in-out infinite}
.orrery.moving .walk .b2{animation-delay:-.55s}
@keyframes w-thigh{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes w-shin{0%,48%{transform:rotate(0)}72%{transform:rotate(58deg)}96%,100%{transform:rotate(0)}}
@keyframes w-arm{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes w-bob{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-1.6px)}}

.dial-tools{display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:0}
.taiji{width:46px; height:46px; display:grid; place-items:center; border-radius:50%}
.taiji:hover{background:var(--band)}
.taiji svg{width:32px; height:32px; display:block}
.taiji[aria-pressed="true"] svg{animation:taiji-spin 5s linear infinite}
@keyframes taiji-spin{to{transform:rotate(360deg)}}
.dial-hint{margin:0; font-size:14px; color:var(--muted); letter-spacing:.06em; text-align:center}
.seg2{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--card)}
.seg2 button{padding:3px 16px; border-radius:999px; font-size:15px; letter-spacing:.2em; color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.tip{position:fixed; z-index:20; pointer-events:none; background:var(--ink); color:var(--paper); font-size:13.5px; line-height:1.5; padding:6px 10px; border-radius:6px; white-space:nowrap; opacity:0; transform:translate(-50%,calc(-100% - 12px)); transition:opacity .12s}
.tip.show{opacity:1}

/* ---------- 下半部分 ---------- */
.lower{display:grid; grid-template-columns:minmax(0,.82fr) minmax(0,1fr); gap:clamp(24px,3.6vw,64px); margin-top:clamp(24px,3vw,44px); align-items:start}
.now-head{display:flex; align-items:baseline; gap:12px; margin-bottom:8px}
.now-head span{font-size:13px; color:var(--muted)}
.legend{list-style:none; margin:0; padding:0; border-top:2px solid rgba(29,30,28,.7); border-bottom:2px solid rgba(29,30,28,.7)}
.legend li + li{border-top:1px solid var(--rule)}
.legend .row{width:100%; display:grid; grid-template-columns:4.2em minmax(0,1fr) auto; align-items:baseline; column-gap:12px; text-align:left; padding:8px 10px}
.legend button.row:hover{background:var(--band)}
.legend button.row[aria-pressed="true"]{background:var(--card); box-shadow:inset 3px 0 0 var(--gold)}
.legend .nm{font-size:13px; color:var(--muted); letter-spacing:.12em}
.legend .val{font-size:18px; font-weight:700; letter-spacing:.06em}
.legend .ext{font-size:14px; color:var(--muted); text-align:right}
.legend .ext svg{width:20px; height:20px; vertical-align:-4px}
.legend .row.off .val{color:var(--faint); font-weight:400}

.cal-head{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.cal-title{flex:1; display:flex; align-items:center; justify-content:center; gap:6px}
.pick{font-size:19px; font-weight:900; letter-spacing:.08em; padding:2px 4px; border-radius:4px; -webkit-appearance:none; appearance:none; text-align:center}
.pick:hover{background:var(--band)}
.cal-today{font-size:14px; padding:4px 12px; border:1px solid var(--line); border-radius:999px}
.cal-today:hover{background:var(--band)}
.grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
.wd{font-size:12px; color:var(--muted); text-align:center; padding:4px 0; letter-spacing:.1em}
.day{position:relative; min-height:60px; border-radius:6px; padding:6px 3px 5px; display:flex; flex-direction:column; align-items:center; gap:1px; background:var(--card)}
.day:hover{background:var(--band)}
.day .n{font-size:18px; line-height:1.2; font-variant-numeric:tabular-nums}
.day .sub{font-size:11px; line-height:1.3; color:var(--muted); white-space:nowrap; overflow:hidden; max-width:100%}
.day .sub.term{color:var(--red); font-weight:700}
.day .sub.fest{color:var(--off)}
.day .tag{position:absolute; top:3px; right:5px; font-size:10px; font-style:normal; line-height:1.4}
.day.out{background:transparent} .day.out .n,.day.out .sub{opacity:.36}
.day.weekend .n{color:var(--muted)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.day.sel{background:var(--ink); color:var(--paper)}
.day.sel .sub,.day.sel .tag,.day.sel .n{color:var(--paper) !important}
.years{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px 16px}
.mini-t{font-size:15px; font-weight:900; letter-spacing:.1em; margin-bottom:4px; padding:0 2px; border-radius:4px}
.mini-t:hover{background:var(--band)}
.mini .grid{gap:1px}
.mini .wd{font-size:10px; padding:1px 0}
.md{font-size:12px; line-height:1.9; text-align:center; border-radius:4px; font-variant-numeric:tabular-nums}
.md:hover{background:var(--band)}
.md.term{color:var(--red); font-weight:900}
.md.off{color:var(--off); font-weight:700}
.md.work{color:var(--work)}
.md.today{box-shadow:inset 0 0 0 1.2px var(--ink)}
.md.sel{background:var(--ink); color:var(--paper)}
.md.blank{visibility:hidden}
.cal-key{margin:10px 0 0; font-size:12.5px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap}
.cal-key b{font-weight:900}
.cal-status{margin:6px 0 0; font-size:13px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; align-items:baseline}

.foot{margin-top:clamp(28px,4vw,52px); padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:14px 40px; flex-wrap:wrap; font-size:14px; color:var(--muted)}
.foot p{margin:0}
.credit{font-size:12.5px; color:var(--faint)}
.actions{display:flex; gap:22px; flex-wrap:wrap; align-items:baseline}
details{max-width:56em}
summary{cursor:pointer; list-style:none; display:inline-block; border-bottom:1px solid currentColor; color:var(--ink)}
summary::-webkit-details-marker{display:none}
details ul{margin:12px 0 0; padding-left:1.2em; line-height:1.9}
.nojs{padding:16px; margin:0 0 16px; background:#FFF6D6; border-radius:6px; font-size:15px}

@media (max-width:1060px){
  .hero{grid-template-columns:minmax(0,1fr) 128px; grid-template-areas:"bar bar" "dial dial" "quote term"}
  .dial-col{padding:0 0 14px; border-bottom:1px solid var(--rule); margin-bottom:14px}
  .term-col{border-right:0; border-left:1px solid var(--rule); padding:4px 0 4px 10px; justify-content:center}
  .quote-col{border-left:0; padding:4px 12px 4px 4px}
  .term-v{height:330px}
  .term-name{font-size:68px}
  .q-v{height:280px}
  .lower{grid-template-columns:minmax(0,1fr)}
  .lab.r-sc{font-size:calc(var(--u)*19px)} .lab.r-q{font-size:calc(var(--u)*18px)} .lab.r-t{font-size:calc(var(--u)*18px)}
  .lab.r-mo{font-size:calc(var(--u)*19px)} .lab.r-s{font-size:calc(var(--u)*32px)}
  .lab.badge{font-size:calc(var(--u)*13px); width:calc(var(--u)*23px); height:calc(var(--u)*23px)}
}
@media (max-width:640px){
  .hbar{grid-template-columns:auto 1fr; grid-template-areas:"title info" "time info"; column-gap:12px; row-gap:2px; padding:2px 2px 12px}
  .title{font-size:22px; letter-spacing:.08em}
  .hbar .clock-time{font-size:26px; line-height:1.15; justify-self:start}
  .hbar .clock-info{font-size:13px; line-height:1.6; text-align:right; justify-self:end; align-self:center}
}
@media (max-width:520px){

  '立春':{q:{t:'东方青色，入通于肝，开窍于目，藏精于肝',s:'金匮真言论'},p:'东方属青色，和肝相通。肝开窍于眼睛，精气藏在肝里。'},

  '春分':{q:{t:'凡阴阳之要，阳密乃固，两者不和，若春无秋，若冬无夏，因而和之，是谓圣度。',s:'生气通天论'},p:'阴阳的关键，在于阳气固密，阴气才守得住。两者不调和，就像只有春没有秋，只有冬没有夏。让它们调和，是最高的法度。'},

    {k:'sc',name:'时辰',val:today?BRANCH[s.sc]+'时':'—',ext:today?hm(s.date):'看今日时显示',off:!today},
    {k:'q', name:'四时',val:today?QUARTERS[s.q].name:'—',ext:today?QUARTERS[s.q].yy:'看今日时显示',off:!today},
    {k:'m', name:'月相',val:PHASES[s.phase],extHTML:miniMoon(s.e)},
    {k:'t', name:'节气',val:TERMS[s.i],ext:termExt},
    {k:'mo',name:'干支月',val:ganzhiMonth(s.ms,s.month)+'月',ext:md(jst)+'-'+md(jen-DAY)},
    {k:null,name:'月/日',val:lunarMonthName(l)+lunarDayName(l.day),ext:md(s.ms)},
    {k:'s', name:'四季',val:SEASONS[s.season].name,ext:SEASONS[s.season].span},
    {k:null,name:'年',val:gz(ly-4)+'年',ext:'公元'+s.date.getFullYear()+'年·生肖'+ZODIAC[(((ly-4)%12)+12)%12]}
  ];
  return rows;
}
function renderLegend(s){
  $('nowTitle').textContent=isToday()?'此刻':'那一日';
  $('nowSub').textContent=isToday()?'':md(s.ms);
  $('legend').innerHTML=legendRows(s).map(function(r){
    var inner='<span class="nm">'+r.name+'</span><span class="val">'+esc(r.val)+'</span><span class="ext">'+(r.extHTML||esc(r.ext))+'</span>';
    if(!r.k||r.off)return '<li><div class="row'+(r.off?' off':'')+'">'+inner+'</div></li>';
    return '<li><button type="button" class="row" data-scale="'+r.k+'" aria-pressed="'+(!!sel&&sel.k===r.k&&sel.i===nowIndex(r.k,s))+'">'+inner+'</button></li>';
  }).join('');
}
function renderTermCol(s){
  var nxt=TERMS[(s.i+1)%24], until=dayOf(s.next)-s.dn, st=new Date(s.start);
  $('termName').textContent=TERMS[s.i];
  $('termMeta').innerHTML=s.dayN===1
    ? '<span><b>今日交节</b></span><br><span>'+cn(st.getHours())+'时'+cn(st.getMinutes())+'分</span>'
    : '<span>第'+cn(s.dayN)+'日</span><br><span>'+(until<=1?'明日'+nxt:cn(until)+'日后'+nxt)+'</span>';
}

/* 右侧：选中某一格就讲这一格；没选就讲所选日期的节气 */
function insightFor(k,i,s){
  if(k==='t'){var e=TERM_TEXT[TERMS[i]];return {scale:'节气',val:TERMS[i],v:e.q.t,src:e.q.s,p:e.p,tip:TERM_TIPS[i],tipSrc:'后世节气养生的通行说法，不是《素问》原文。',
    note:'每个节气配的是它所在季节的原文，《素问》没有逐个讲二十四节气。'};}
  if(k==='s'){var se=SEASONS[i];return {scale:'四季',val:se.name,v:se.hl,src:'四气调神大论',p:se.p,full:se.t,hl:se.hl,tip:se.tip,tipSrc:'据原文。'};}
  if(k==='mo'){var mp=MONTH_PAIRS[Math.floor(i/2)];return {scale:'干支月',val:BRANCH[(2+i)%12]+'月（'+ganzhiMonth(s.ms,i)+'月）',v:mp.hl,src:'诊要经终论',p:mp.p,full:MONTH_TEXT,hl:mp.hl,tip:mp.tip,tipSrc:'据原文“人气在某处”引申。',
    note:'《素问》按正月、二月记月。干支月以节为界，寅月就是正月，'+BRANCH[(2+i)%12]+'月就是'+MONTH_NAMES[i]+'。'};}
  if(k==='m'){var l=s.lunar, e2=elong(noonOf(l.start+i)), mo=MOON[moonState(e2)];
    return {scale:'月相',val:'农历'+lunarMonthName(l)+lunarDayName(i+1)+'　'+PHASES[phaseOf(e2)],v:mo.hl,src:'八正神明论',p:mo.p,full:MOON_TEXT,hl:mo.hl,tip:mo.tip,tipSrc:'据原文引申。原文讲的是针刺要看月相，这里转成日常起居的说法。',note:mo.note||''};}
  if(k==='q'){var qq=QUARTERS[i];return {scale:'四时',val:qq.name,v:qq.hl,src:'金匮真言论',p:qq.p,full:QUARTER_TEXT,hl:qq.hl,tip:qq.tip,tipSrc:qq.src+'。'};}
  var h=(2*i)%24; if(h<3)h+=24;
  var part=DAY_ARC.parts.filter(function(x){return h>=x.from&&h<x.to;})[0], tp=SHICHEN_TIPS[i];
  return {scale:'时辰',val:BRANCH[i]+'时（'+pad((2*i+23)%24)+':00-'+pad((2*i+1)%24)+':00）',v:part.hl,src:DAY_ARC.s,p:part.p,full:DAY_ARC.t,hl:part.hl,more:SHICHEN_MORE[i],
    tip:tp[0]+'当令。'+tp[1],tipSrc:'后世“子午流注”的说法（金元以后医家整理），不是《素问》原文。',
    note:'《素问》讲一天，用的是平旦、日中、日西、夜半这些说法，没有用子丑寅卯的十二时辰。'};
}
function renderQuote(s){
  var x=sel?insightFor(sel.k,sel.i,s):insightFor('t',s.i,s);
  $('qScale').textContent=x.scale; $('qVal').textContent=x.val;
  $('qV').innerHTML='<p>'+esc(x.v)+'</p><cite>《素问·'+esc(x.src)+'》</cite>';
  $('qPlain').textContent=x.p;
  $('qMore').innerHTML=x.more?'另见：'+esc(x.more.t)+'<cite>《素问·'+esc(x.more.s)+'》</cite>':'';
  if(x.full){var j=x.full.indexOf(x.hl);$('qFull').innerHTML='原文全段：'+esc(x.full.slice(0,j))+'<mark>'+esc(x.hl)+'</mark>'+esc(x.full.slice(j+x.hl.length));}else $('qFull').innerHTML='';
  $('qTip').innerHTML='<b>养生</b>'+esc(x.tip)+'<small>'+esc(x.tipSrc)+'仅供日常参考，不是医疗建议。</small>';
  $('qNote').textContent=x.note||'';
  var qv=$('qV'); qv.scrollLeft=qv.scrollWidth;
}
function renderClock(){
  var n=new Date(), dn=dayOf(n.getTime()), hh=n.getHours()+n.getMinutes()/60, m=Math.floor(norm(sunLon(n.getTime())-270-45)/30)%12;
  $('clockTime').textContent=hm(n);
  $('clockDate').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日(星期'+WEEK[n.getDay()]+')';
  $('clockGz').textContent=gz(jieYear(n.getTime())-4)+'年/'+ganzhiMonth(n.getTime(),m)+'月/'+ganzhiDay(dn)+'日/'+BRANCH[Math.floor(((hh+1)%24)/2)]+'时';
}

/* 日期栏 + 日期带 */
var stripKey=null;
function miniMoon(e){return '<svg viewBox="-7 -7 14 14"><circle r="6" fill="#2B2B2B"/><path d="'+moonPath(0,0,6,e)+'" fill="#F6F1E2"/></svg>';}
function renderDateBar(s){ $('backNow').classList.toggle('is-today',isToday()); }

/* ---------- 日历 ---------- */
var termCache={};
function termsByDay(y){var map={},t=termInstant(1,Date.UTC(y,0,5));for(var n=0;n<24;n++){var k=(1+n)%24;if(n)t=termInstant(k,t+15.2184*DAY);map[dayOf(t)]=TERMS[k];}return map;}
function termOn(dn){var y=dateOfDay(dn).y;if(!termCache[y])termCache[y]=termsByDay(y);return termCache[y][dn];}
function holidayFor(dn){var dt=dateOfDay(dn),list=holidays[dt.y];if(!list)return null;var key=pad(dt.m+1)+'-'+pad(dt.d);for(var i=0;i<list.length;i++)if(list[i][0]===key)return list[i];return null;}
function fillPickers(){var h='';for(var y=1950;y<=2100;y++)h+='<option value="'+y+'">'+cnYear(y)+'年</option>';$('pickY').innerHTML=h;h='';for(var m=0;m<12;m++)h+='<option value="'+m+'">'+cn(m+1)+'月</option>';$('pickM').innerHTML=h;}
function renderCalendar(){
  $('pickY').value=calY; $('pickM').value=calM; $('pickM').hidden=(calView==='year');
  var b=document.querySelectorAll('[data-view]');for(var i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',b[i].getAttribute('data-view')===calView);
  if(calView==='year')renderYear(); else renderMonth();
  renderHolidayStatus();
}
function renderMonth(){
  var selDn=current().dn, todayDn=dayOf(Date.now()), first=civDay(calY,calM,1), start=first-((dateOfDay(first).w+6)%7);
  var h='<div class="grid" role="grid">'+['一','二','三','四','五','六','日'].map(function(x){return '<div class="wd">'+x+'</div>';}).join('');
  for(var i=0;i<42;i++){
    var dn=start+i, dt=dateOfDay(dn), out=dt.m!==calM, l=lunarOf(dn), tm=termOn(dn), hol=holidayFor(dn), prev=holidayFor(dn-1), sub, sc='';
    if(tm){sub=tm;sc='term';} else if(hol&&hol[2]===1&&!(prev&&prev[1]===hol[1]&&prev[2]===1)){sub=hol[1];sc='fest';} else sub=l.day===1?lunarMonthName(l):lunarDayName(l.day);
    var cls='day'+(out?' out':'')+(dn===todayDn?' today':'')+(dn===selDn?' sel':'')+((dt.w===0||dt.w===6)?' weekend':'');
    h+='<button type="button" class="'+cls+'" data-dn="'+dn+'" aria-label="'+(dt.m+1)+'月'+dt.d+'日 '+sub+(hol?(hol[2]?' 放假':' 补班'):'')+'"><span class="n">'+dt.d+'</span><span class="sub '+sc+'">'+esc(sub)+'</span>'
      +(hol?'<i class="tag '+(hol[2]?'off':'work')+'">'+(hol[2]?'休':'班')+'</i>':'')+'</button>';
  }
  $('calBody').innerHTML=h+'</div>';
}
function renderYear(){
  var selDn=current().dn, todayDn=dayOf(Date.now()), h='<div class="years">';
  for(var m=0;m<12;m++){
    var first=civDay(calY,m,1), lead=(dateOfDay(first).w+6)%7, days=Math.round((Date.UTC(calY,m+1,1)-Date.UTC(calY,m,1))/DAY);
    h+='<div class="mini"><button type="button" class="mini-t" data-m="'+m+'">'+cn(m+1)+'月</button><div class="grid">'+['一','二','三','四','五','六','日'].map(function(x){return '<div class="wd">'+x+'</div>';}).join('');
    for(var b=0;b<lead;b++)h+='<span class="md blank"></span>';
    for(var d=1;d<=days;d++){var dn=first+d-1, tm=termOn(dn), hol=holidayFor(dn);
      h+='<button type="button" class="md'+(tm?' term':'')+(hol?(hol[2]?' off':' work'):'')+(dn===todayDn?' today':'')+(dn===selDn?' sel':'')+'" data-dn="'+dn+'" title="'+(m+1)+'月'+d+'日'+(tm?' '+tm:'')+(hol?' '+hol[1]+(hol[2]?'放假':'补班'):'')+'">'+d+'</button>';}
    h+='</div></div>';
  }
  $('calBody').innerHTML=h+'</div>';
}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var holState={};
function loadHolidayCache(){Object.keys(HOLIDAYS_BUILTIN).forEach(function(y){holidays[y]=HOLIDAYS_BUILTIN[y];});for(var y=calY-1;y<=calY+1;y++){var c=store('neijing-holiday-'+y);if(c){try{var o=JSON.parse(c);if(o.days&&o.days.length)holidays[y]=o.days;}catch(e){}}}}
function renderHolidayStatus(){
  var y=calY, st=holState[y], txt;
  if(holidays[y]&&holidays[y].length)txt=cnYear(y)+'年放假安排已载入。';
  else if(st==='loading')txt='正在获取'+cnYear(y)+'年放假安排……';
  else if(st==='empty')txt=cnYear(y)+'年放假安排还没公布，通常在上一年年底公布。';
  else if(st==='fail')txt='没连上网，放假安排先不显示，其他内容不受影响。';
  else txt=cnYear(y)+'年放假安排还没有获取。';
  $('holStatus').textContent=txt;
}
function fetchHolidays(y,force){
  if(!force&&holidays[y]&&holidays[y].length)return;
  if(!window.fetch||holState[y]==='loading')return;
  var cached=store('neijing-holiday-'+y);
  if(!force&&cached){try{var o=JSON.parse(cached);if(Date.now()-o.at<7*DAY){holState[y]=o.days.length?'ok':'empty';return;}}catch(e){}}
  holState[y]='loading'; renderHolidayStatus();
  var urls=HOLIDAY_URLS.map(function(u){return u.replace('{y}',y);});
  (function tryNext(i){
    if(i>=urls.length){holState[y]='fail';if(y===calY)renderHolidayStatus();return;}
    fetch(urls[i],{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
      var days=(j.days||[]).filter(function(x){return String(x.date).slice(0,4)===String(y);}).map(function(x){return [x.date.slice(5),x.name,x.isOffDay?1:0];});
      store('neijing-holiday-'+y,JSON.stringify({at:Date.now(),days:days}));
      if(days.length){holidays[y]=days;holState[y]='ok';}else holState[y]='empty';
      if(y===calY)render();
    }).catch(function(){tryNext(i+1);});
  })(0);
}

/* ---------- 总刷新 ---------- */
function render(){var s=current();renderClock();renderDateBar(s);renderOrrery(s);renderLegend(s);renderTermCol(s);renderQuote(s);renderCalendar();}
function setView(ms){
  viewMs=ms; sel=null;
  var d=new Date(ms===null?Date.now():ms); calY=d.getFullYear(); calM=d.getMonth();
  loadHolidayCache(); render(); fetchHolidays(calY);
}
function select(k,i){sel=(sel&&sel.k===k&&sel.i===i)?null:{k:k,i:i};render();}
function clearSel(){if(sel){sel=null;render();}}

/* ---------- 悬停提示 ---------- */
var tip=$('tip'), tipTimer=null;
function tipText(k,i){
  var s=current();
  if(k==='sc')return BRANCH[i]+'时：'+pad((2*i+23)%24)+':00-'+pad((2*i+1)%24)+':00';
  if(k==='q')return QUARTERS[i].name+'：'+QUARTERS[i].yy;
  if(k==='t')return '节气：'+TERMS[i]+'（'+termRange(i,s)+'）';
  if(k==='mo')return BRANCH[(2+i)%12]+'月（'+ganzhiMonth(s.ms,i)+'月）';
  return '';
}
function showTip(el,x,y){var t=el.getAttribute('data-tip')||tipText(el.getAttribute('data-k'),+el.getAttribute('data-i'));if(!t){hideTip();return;}tip.textContent=t;x=Math.max(90,Math.min(window.innerWidth-90,x));tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.add('show');}
function hideTip(){tip.classList.remove('show');}

/* ---------- 拖动与点击 ---------- */
function angleAt(e){var r=orrery.getBoundingClientRect();return Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))/D2R;}
orrery.addEventListener('pointerdown',function(e){
  var sg=e.target.closest('.seg');
  if(!sg&&mode!=='move')return;
  drag={k:sg?sg.getAttribute('data-k'):null,whole:!sg,seg:sg,x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,la:angleAt(e),lt:performance.now(),moved:false,type:e.pointerType};
  try{orrery.setPointerCapture(e.pointerId);}catch(_){}
  kick();
});
orrery.addEventListener('pointermove',function(e){
  if(!drag){var sg=e.target.closest('.seg');if(e.pointerType==='mouse'){if(sg)showTip(sg,e.clientX,e.clientY);else hideTip();}return;}
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>5){drag.moved=true;orrery.classList.add('dragging');hideTip();}
  if(!drag.moved)return;
  var now=performance.now(), dt=Math.max(.008,(now-drag.lt)/1000), dx=e.clientX-drag.lx, dy=e.clientY-drag.ly;
  if(mode==='move'){
    var ang=Math.hypot(dx,dy)*.45, ax=[-dy,dx,0];
    if(ang>0){
      var Rd=rot(ax[0],ax[1],ax[2],ang), L=Math.hypot(ax[0],ax[1])||1, wv=[ax[0]/L*ang/dt,ax[1]/L*ang/dt,0];
      if(drag.whole){Q=mm(Rd,Q);QS.w=QS.w.map(function(v,i){return v*.5+wv[i]*.5;});QS.sp=0;QS.dir=null;QS.wp=0;}
      else{var g=G[drag.k];g.E=mm(mm(tr(Q),mm(Rd,Q)),g.E);g.S.w=g.S.w.map(function(v,i){return v*.5+wv[i]*.5;});g.S.sp=0;g.S.dir=null;g.S.wp=0;}
    }
  }else{
    var g2=G[drag.k], a=angleAt(e), d=a-drag.la; if(d>180)d-=360; if(d<-180)d+=360; drag.la=a;
    g2.spin+=d; g2.sv=g2.sv*.5+(d/dt)*.5;
  }
  drag.lx=e.clientX; drag.ly=e.clientY; drag.lt=now;
});
var justPicked=false;
function endDrag(e){
  if(!drag)return;
  var d=drag; drag=null; orrery.classList.remove('dragging');
  justPicked=true; setTimeout(function(){justPicked=false;},0);
  if(!d.moved){
    if(d.seg){select(d.seg.getAttribute('data-k'),+d.seg.getAttribute('data-i'));
      if(d.type!=='mouse'){showTip(d.seg,e.clientX,e.clientY);clearTimeout(tipTimer);tipTimer=setTimeout(hideTip,2600);}}
    else clearSel();
  }else if(Math.abs(performance.now()-d.lt)>120){if(d.whole)QS.w=[0,0,0];if(d.k)G[d.k].S.w=[0,0,0];}
  kick();
}
orrery.addEventListener('pointerup',endDrag);
orrery.addEventListener('pointercancel',function(){if(drag){drag=null;orrery.classList.remove('dragging');kick();}});
orrery.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')hideTip();});
$('taiji').addEventListener('click',function(){setMode(mode==='move'?'still':'move');});
/* 点页面空白处取消选中 */
document.addEventListener('click',function(e){
  if(!sel||justPicked)return;
  if(e.target.closest('.seg,button,select,a,summary,details,.cal,.legend,.quote-col,.tip,.hbar'))return;
  clearSel();
});

/* ---------- 其他交互 ---------- */
$('legend').addEventListener('click',function(e){var b=e.target.closest('button.row');if(b){var k=b.getAttribute('data-scale');select(k,nowIndex(k,current()));}});
function pickDay(dn){var c=new Date(),dt=dateOfDay(dn),ms=new Date(dt.y,dt.m,dt.d,c.getHours(),c.getMinutes()).getTime();if(dn===dayOf(Date.now()))ms=null;setView(ms);}
$('calBody').addEventListener('click',function(e){
  var t=e.target.closest('[data-m]'); if(t){calM=+t.getAttribute('data-m');calView='month';renderCalendar();return;}
  var b=e.target.closest('[data-dn]'); if(!b)return; if(calView==='year')calView='month'; pickDay(+b.getAttribute('data-dn'));
});
document.querySelectorAll('[data-view]').forEach(function(b){b.addEventListener('click',function(){calView=b.getAttribute('data-view');renderCalendar();});});
function shift(n){if(calView==='year')calY+=n;else{calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}}loadHolidayCache();renderCalendar();fetchHolidays(calY);}
$('prev').addEventListener('click',function(){shift(-1);});
$('next').addEventListener('click',function(){shift(1);});
$('pickY').addEventListener('change',function(){calY=+this.value;loadHolidayCache();renderCalendar();fetchHolidays(calY);});
$('pickM').addEventListener('change',function(){calM=+this.value;renderCalendar();});
$('calToday').addEventListener('click',function(){calView='month';setView(null);});
$('backNow').addEventListener('click',function(){setView(null);});
$('holFetch').addEventListener('click',function(){fetchHolidays(calY,true);});
window.addEventListener('resize',function(){measure();placeLabels();});

/* ---------- 启动 ---------- */
buildStatic();
(function(){['s','mo','t','m','q','sc'].forEach(function(k){plane.appendChild(layers[k]);});
  var NS='http://www.w3.org/2000/svg', sv=document.createElementNS(NS,'svg'); sv.setAttribute('class','links');
  sv.innerHTML='<defs><filter id="linkBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter></defs><path class="lg" filter="url(#linkBlur)"/><path class="lc"/>';
  labelsEl.insertBefore(sv,labelsEl.firstChild); linkGlow=sv.querySelector('.lg'); linkCore=sv.querySelector('.lc');})();
fillPickers(); measure();
(function(){var n=new Date();calY=n.getFullYear();calM=n.getMonth();})();
loadHolidayCache(); renderClock();
if(reduce)render(); else requestAnimationFrame(function(){requestAnimationFrame(render);});
fetchHolidays(calY);
if(store('neijing-mode')==='move'&&!reduce)setTimeout(function(){setMode('move');},700);
setInterval(function(){if(viewMs===null)render();else renderClock();},30000);

})();
</script>
